/* ===== Sounddesign =====
   Mehrschichtige Web-Audio-Engine (alles synthetisch, keine Dateien):
   • Motor: Sägezahn + Sub-Square + verstimmte 2. Säge → leichte Sättigung → Tiefpass (öffnet mit Last/Drehzahl),
     dazu Ansaug-/Auspuff-Rauschen. Drehzahl folgt einem 6-Gang-Getriebe (Schaltvorgänge hörbar, Drehzahlabfall).
   • Turbo-Pfeifen unter Last, Blow-off + Fehlzündungs-Knallen beim Gaswegnehmen.
   • Untergrund: Asphalt-Zischen, Schotter-Rollen, Eis-Hauch, Wind ∝ Tempo², Quietschen/Rutschgeräusch bei Drift.
   • Ereignisse: Countdown, Mess-Tore, Crash/Schrammen, Landung, Sprung, Radverlust, Boxenstopp, Ziel, Reserve-Warnung.
   Alle Dauergeräusche laufen über den Bus au.g (wird bei Rennende/Pause stumm geschaltet), Einzelereignisse über au.m. */
function audio(){
  if(au){try{if(au.A.state==='suspended')au.A.resume()}catch(e){}return}
  try{
    const A=new(window.AudioContext||window.webkitAudioContext)();
    if(A.state==='suspended'){try{A.resume()}catch(e){}}
    const comp=A.createDynamicsCompressor();
    comp.threshold.value=-16;comp.knee.value=20;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.22;
    const m=A.createGain();m.gain.value=.95;comp.connect(m);m.connect(A.destination);
    const g=A.createGain();g.gain.value=0;g.connect(comp);
    // Rausch-Puffer (2 s, loopbar)
    const nb=A.createBuffer(1,A.sampleRate*2,A.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const noise=()=>{const n=A.createBufferSource();n.buffer=nb;n.loop=true;n.start(0,Math.random()*1.5);return n};
    const filt=(type,f,q)=>{const x=A.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q||1;return x};
    const gain=v=>{const x=A.createGain();x.gain.value=v;return x};
    // Motor
    const o1=A.createOscillator(),o2=A.createOscillator(),o3=A.createOscillator();
    o1.type='sawtooth';o2.type='square';o3.type='sawtooth';o3.detune.value=9;
    const mix=gain(1),g2=gain(.45),g3=gain(.55);
    const ws=A.createWaveShaper(),curve=new Float32Array(257);
    for(let i=0;i<257;i++){const x=i/128-1;curve[i]=Math.tanh(x*2.4)}
    ws.curve=curve;
    const lp=filt('lowpass',900,2.2),eng=gain(0);
    o1.connect(mix);o2.connect(g2);g2.connect(mix);o3.connect(g3);g3.connect(mix);
    mix.connect(ws);ws.connect(lp);lp.connect(eng);eng.connect(g);
    // Ansaug-/Auspuff-Rauschen
    const rasp=gain(0),raspF=filt('bandpass',500,1.2);
    const nRasp=noise();nRasp.connect(raspF);raspF.connect(rasp);rasp.connect(g);
    // Turbo-Pfeifen
    const to=A.createOscillator();to.type='sine';to.frequency.value=720;
    const tg=gain(0);to.connect(tg);tg.connect(g);
    // Untergrund-Rollgeräusch
    const nRoad=noise(),roadF=filt('bandpass',1100,.6),roadG=gain(0);
    nRoad.connect(roadF);roadF.connect(roadG);roadG.connect(g);
    // Dezente Umgebungsatmosphäre (breitbandig, stark gefiltert)
    const nAmb=noise(),ambF=filt('lowpass',260,.45),ambG=gain(0);nAmb.connect(ambF);ambF.connect(ambG);ambG.connect(g);
    // Wind
    const nWind=noise(),windF=filt('lowpass',400,.7),windG=gain(0);
    nWind.connect(windF);windF.connect(windG);windG.connect(g);
    // Reifenquietschen (Ton) + Rutschgeräusch (Rauschen)
    const so=A.createOscillator();so.type='sine';so.frequency.value=520;
    const soF=filt('bandpass',650,1.1),soG=gain(0);so.connect(soF);soF.connect(soG);soG.connect(g);
    const nSl=noise(),slF=filt('bandpass',1300,1.1),slG=gain(0);
    nSl.connect(slF);slF.connect(slG);slG.connect(g);
    [o1,o2,o3,to,so].forEach(o=>o.start());
    au={A,g,m:comp,nb,o1,o2,o3,lp,eng,rasp,raspF,tg,to,roadF,roadG,windF,windG,ambF,ambG,so,soF,soG,slF,slG,
        gear:0,lastG:0,cd:0,shiftT:0,rpm:950,surf:-1};
  }catch(e){}
}
function sndNoise(dur,type,f0,f1,vol,q,dly){
  if(!au)return;
  try{
    const A=au.A,t0=A.currentTime+(dly||0);
    const s=A.createBufferSource();s.buffer=au.nb;s.loop=true;
    const f=A.createBiquadFilter();f.type=type;f.Q.value=q||1;
    f.frequency.setValueAtTime(Math.max(20,f0),t0);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    const gn=A.createGain();
    gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t0+Math.min(.012,dur*.25));
    gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f);f.connect(gn);gn.connect(au.m);s.start(t0,Math.random()*1.5);s.stop(t0+dur+.05);
  }catch(e){}
}
function sndTone(type,f0,f1,dur,vol,dly){
  if(!au)return;
  try{
    const A=au.A,t0=A.currentTime+(dly||0);
    const o=A.createOscillator();o.type=type;
    o.frequency.setValueAtTime(Math.max(20,f0),t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    const gn=A.createGain();
    gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t0+.008);
    gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(gn);gn.connect(au.m);o.start(t0);o.stop(t0+dur+.05);
  }catch(e){}
}
function sndEvent(name,v){
  if(!au)return;
  try{
    if(au.A.state==='suspended')au.A.resume();
    switch(name){
      case 'beep':sndTone('square',880,880,.16,.07);sndTone('sine',880,880,.18,.13);sndTone('sine',1760,1760,.08,.03);break;
      case 'gunshot':sndNoise(.05,'highpass',1800,5200,.5,.7);sndNoise(.55,'lowpass',3800,180,.42,.8,.01);sndTone('sine',170,38,.32,.42);sndTone('square',95,40,.14,.12);sndNoise(1.1,'bandpass',900,260,.06,.6,.12);break;
      case 'go':sndTone('sine',1040,1040,.42,.2);sndTone('triangle',2080,2080,.3,.06);sndNoise(.25,'highpass',2500,6000,.03);break;
      case 'gateOk':sndTone('sine',660,660,.09,.12);sndTone('sine',990,990,.14,.12,.08);break;
      case 'gateFail':sndTone('square',240,150,.22,.07);break;
      case 'warn':sndTone('square',1250,1250,.09,.06);sndTone('square',1250,1250,.09,.06,.16);break;
      case 'crash':{
        const d=Math.max(2,v||10),k=Math.min(1,d/34);
        sndNoise(.16+k*.3,'lowpass',2200,200,.14+k*.28,.8);
        sndTone('sine',130,38,.22+k*.2,.2+k*.25);
        sndTone('square',340,170,.12,.04+k*.06);            // Blech-Knall
        sndNoise(.28,'bandpass',3200,1400,.05+k*.07,3,.02);   // Splitter
        break}
      case 'scrape':sndNoise(.34,'bandpass',2800,1900,.09,2.4);sndTone('sawtooth',900,640,.26,.018);break;
      case 'land':sndTone('sine',125,42,.2,.24);sndNoise(.17,'lowpass',1400,260,.13,.7);break;
      case 'jump':sndNoise(.45,'highpass',500,3200,.05,.8);break;
      case 'wheel':sndTone('sine',720,690,.5,.09);sndTone('sine',1140,1100,.4,.06);sndNoise(.2,'bandpass',2400,900,.12,1.5);break;
      case 'blow':sndNoise(.42,'highpass',1800,5200,.085,.7);sndTone('sine',2600,1500,.36,.012);break;
      case 'pop':sndNoise(.07,'bandpass',420+Math.random()*320,180,.12+Math.random()*.06,1.4);break;
      case 'pit':for(let k=0;k<5;k++){sndNoise(.07,'bandpass',3100,2700,.07,2,.1+k*.11);sndTone('square',180,160,.05,.03,.1+k*.11)}break;
      case 'finish':[523.25,659.25,783.99,1046.5].forEach((f,i)=>{sndTone('triangle',f,f,.34,.13,i*.13);sndTone('sine',f*2,f*2,.22,.04,i*.13)});break;
    }
  }catch(e){}
}
function sfx(sp,slip,gas,ex){
  if(!au)return;
  const A=au.A,r=A.currentTime,live=(state==='play'||state==='count');
  ex=ex||{};
  const ratio=Math.max(0,Math.min(1.25,ex.r!==undefined?ex.r:sp/460));
  const air=!!ex.air, off=!!ex.off, g=gas?1:0, hp=ex.hp===undefined?100:ex.hp;
  // Untergrund (0 Asphalt, 1 Schotter/Erde, 2 Eis) – Filter nur bei Wechsel setzen
  const surf=BI.asphalt?0:BI.ice?2:1;
  if(surf!==au.surf){au.surf=surf;au.roadF.frequency.setTargetAtTime(surf===0?1150:surf===2?2800:620,r,.05);au.roadF.Q.value=surf===1?.35:.7}
  // 6-Gang-Getriebe: Gang aus Tempo, Drehzahl im Gang
  const gp=Math.min(5.99,ratio*5.4),gear=Math.floor(gp),frac=gp-gear;
  let rpm=ratio<.012?(950+g*2300):(1350+frac*(gear===0?4700:4300));
  if(state==='count')rpm=950+Math.sin(r*9)*35;
  if(air)rpm=Math.min(7600,rpm+1200);
  if(gear!==au.gear){
    if(live&&ratio>.05&&gear>au.gear)au.shiftT=r+.075;
    if(live&&gear>au.gear&&g&&ratio>.2)sndEvent('pop');
    au.gear=gear;
  }
  const f0=rpm/30;                                  // Zündfrequenz eines Vierzylinders
  au.o1.frequency.setTargetAtTime(f0,r,.035);
  au.o2.frequency.setTargetAtTime(f0*.5,r,.035);
  au.o3.frequency.setTargetAtTime(f0,r,.035);
  au.o3.detune.setTargetAtTime(hp<40?(Math.random()-.5)*70:9,r,.02);   // angeschlagener Motor klingt rau
  const load=live?(g?1:.38):0, duck=(r<au.shiftT)?.35:1, rn=Math.min(1,rpm/7500);
  au.eng.gain.setTargetAtTime((live?(.05+.065*load+.016*ratio)*duck:0)*motorVolume,r,.04);
  au.lp.frequency.setTargetAtTime(480+rpm*.22+load*950,r,.05);
  au.raspF.frequency.setTargetAtTime(300+rpm*.12,r,.05);
  au.rasp.gain.setTargetAtTime((live?(.012+.034*load*rn)*duck:0)*motorVolume,r,.05);
  // Turbo pfeift unter Last, Blow-off + Knallen beim Gaswegnehmen
  au.to.frequency.setTargetAtTime(1300+ratio*2600+(g?500:0),r,.12);
  au.tg.gain.setTargetAtTime((live&&g&&ratio>.18?(.0004+.0012*Math.min(1,ratio)):0)*motorVolume,r,g?.18:.06);
  if(au.lastG&&!g&&live&&ratio>.45&&r>au.cd){
    au.cd=r+.8;sndEvent('blow');
    for(let k=0;k<3;k++)setTimeout(()=>{if(au&&state==='play')sndEvent('pop')},70+k*80+Math.random()*50);
  }
  au.lastG=g;
  // Rollgeräusch, Wind
  const rollVol=off?.085:(surf===0?.036:surf===2?.02:.062);
  au.roadG.gain.setTargetAtTime((live&&!air?Math.min(1,ratio*1.3)*rollVol:0)*ambientVolume,r,.07);
  au.windF.frequency.setTargetAtTime(350+ratio*950,r,.1);
  au.windG.gain.setTargetAtTime((live?ratio*ratio*.028:0)*ambientVolume,r,.1);
  au.ambF.frequency.setTargetAtTime(180+(BI&&BI.sea?100:0)+(weather?70:0),r,.4);
  au.ambG.gain.setTargetAtTime((live?.004:0)*ambientVolume,r,.5);
  // Quietschen (Asphalt/Eis) bzw. Rutschgeräusch (Schotter/Gras) beim Querrutschen
  const slipN=Math.max(0,Math.min(1,(slip-65)/150));
  const squeal=live&&!air&&!off&&surf!==1?slipN:0, slide=live&&!air?slipN*(off||surf===1?1:.4):0;
  au.so.frequency.setTargetAtTime(1500+ratio*650+slip*1.2,r,.05);
  au.soG.gain.setTargetAtTime(squeal*(surf===0?.006:.003),r,.08);
  au.slF.frequency.setTargetAtTime(1000+slip*3,r,.06);
  au.slG.gain.setTargetAtTime(slide*.06,r,.06);
  au.g.gain.setTargetAtTime(live?1:0,r,.1);
}

  }else if(wmActive && wmIsFreeWeekend && altEventActive){

function detachWheel(prefSide){
  let cand=[];
  if(prefSide<0) cand=[0,2].filter(i=>car.wheels[i]===1);
  else if(prefSide>0) cand=[1,3].filter(i=>car.wheels[i]===1);
  if(!cand.length) cand=[0,1,2,3].filter(i=>car.wheels[i]===1);
  if(!cand.length) return false;

  const wIdx=cand[Math.floor(Math.random()*cand.length)];
  car.wheels[wIdx]=0;
  sndEvent('wheel');

  const wOff=[[17,-15],[17,15],[-17,-15],[-17,15]][wIdx];
  const c=Math.cos(car.a),s=Math.sin(car.a);
  const wx=car.x+c*wOff[0]-s*wOff[1];
  const wy=car.y+s*wOff[0]+c*wOff[1];
  const sideDir=(wIdx===1||wIdx===3)?1:-1;
  debris.push({
    x:wx, y:wy,
    vx:car.vx*0.65 - s*sideDir*(90+Math.random()*90) + (Math.random()-0.5)*60,
    vy:car.vy*0.65 + c*sideDir*(90+Math.random()*90) + (Math.random()-0.5)*60,
    a:car.a, va:(Math.random()-0.5)*14, life:12
  });
  for(let i=0;i<18;i++){
    fx.push({x:wx,y:wy,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,col:i%2?'#ffae00':'#ffffff',sz:3.5,life:0.45+Math.random()*0.3});
  }
  return wIdx;
}

function triggerDNF(reason){

    wmDay=0;wmShowTrackInfo=false;

      h+='<button class="btn" onclick="showWMFinal()">🏆 WM-Endabrechnung</button>';

function finish(){
  if(!resDay)sndEvent('finish');
  if(resDay){resDayEnd(true);return;}
  if(!wmActive){
    if(schoolActive){schoolFinish(t+pen);return}
    state='end';if(au)au.g.gain.value=0;
    activeQuest=null;renderQuestHUD();
    const total=t+pen;
    const recapHtml=raceRecapHtml(total);
    const bestRes=recordBestRun(total);
    const wObj=WEATHERS[weather]||WEATHERS[0];
    const lObj=TRACK_LENGTHS.find(x=>x.id===trackLenMod)||TRACK_LENGTHS[1];
    let h='<h1>🏁 Testfahrt beendet</h1><div class="big">'+fmt(total)+'</div>'+
          (bestRes.isNew?'<div class="up" style="display:block;border-left:4px solid #e8c96f"><b style="color:#e8c96f">🏅 Neue Bestzeit: '+fmt(total)+'</b></div>':'')+
          recapHtml+
          '<p>'+BI.ic+' <b>'+BI.n+'</b> · '+lObj.name+' · '+wObj.ic+' '+wObj.n+'</p>'+
          '<div class="stat-grid">'+
            '<div>⏱️ Fahrzeit: <b>'+fmt(t)+'</b></div>'+
            '<div>⚠️ Strafen: <b>+'+pen+' s</b></div>'+
            '<div>🛠️ Zustand: <b>'+car.hp+'%</b></div>'+ 
            '<div>⛽ Rest-Tank: <b>'+car.fuel.toFixed(1)+' L</b></div>'+
          '</div>'+
          '<button class="btn" onclick="requestStart()">🔄 Nochmal fahren</button>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
            '<button class="btn sec" onclick="openSingleSetup()">⚙️ Strecken-Setup</button>'+
            '<button class="btn sec" onclick="openGarage()">🔧 Autokonfiguration</button>'+
          '</div>'+
          '<button class="btn sec" onclick="menuCard()">Hauptmenü</button>';
    showCard(h);
    say('Testfahrt beendet! Zeit '+fmt(total));
    return;
  }
  try{resOnFinish();}catch(e){}
  if(wmActive && wmIsFreeWeekend && altEventActive){
    const ev=altEventActive;
    const totalNow = t + pen;
    const stageTime = Math.max(5, totalNow - altStageStartTime);
    ev.stages[altStageIdx].playerTime = fmt(stageTime);

    const stagePen = Math.max(0, pen - altStats.pen);
    if(stagePen === 0) altStats.cleanStages++;
    altStats.pen = pen;
    altStats.jumps += runJumps;
    altStats.minHp = Math.min(altStats.minHp, car.hp);
    altStats.maxTopRatio = Math.max(altStats.maxTopRatio, runMaxRatio);
    altStats.bestSpeedHold = Math.max(altStats.bestSpeedHold||0, speedHoldSeconds||0);

    adaptAI(stageTime);
    let stageResults=[{name:'⭐ Du', time:stageTime, isPlayer:true}];
    AI_DRIVERS.forEach(ai=>{
      const aiSt = aiTime(ai);
      stageResults.push({name:ai.name, time:aiSt});
    });
    stageResults.sort((a,b)=>a.time-b.time);
    currentPlayerRank = stageResults.findIndex(r=>r.isPlayer)+1;

    const isLastStage = (altStageIdx >= ev.stages.length - 1);
    stageResults.forEach(r=>{
      let found=ev.standings.find(s=>s.name===r.name);
      if(!found){found={name:r.name,totalTime:0,isPlayer:r.isPlayer};ev.standings.push(found);}
      if(r.isPlayer){
        found.totalTime = totalNow;
      }else{
        found.totalTime += r.time + (isLastStage ? 0 : 5.0);
      }
    });
    ev.standings.sort((a,b)=>a.totalTime-b.totalTime);
    const overallRank = ev.standings.findIndex(s=>s.isPlayer)+1;

    if(!isLastStage){
      const nextStage=ev.stages[altStageIdx+1];
      const nextFuelRate=getCarStats(car.fuel,true).fuelRate;
      const nextStageFuelNeed=84*(0.95+0.06*nextFuelRate)*(researched.fuel?0.96:1.0);
      if(nextStage && car.fuel>=nextStageFuelNeed+3){
        // Die 200-L-Verbundtank-Abstimmung kann eine komplette Etappe ohne Service-Stopp überbrücken.
        altStageIdx++;
        pitTargetFuel=car.fuel;
        pitStartFuel=car.fuel;
        pitDuration=0;
        pitElapsed=0;
        altStageStartTime=totalNow;
        toast('⛽ Reichweite reicht: Tankstopp ausgelassen!');
        say('Tankstopp ausgelassen');
        window.startNextAltStage();
        return;
      }
      car.vx=0;car.vy=0;car.z=0;car.vz=0;
      if(au)au.g.gain.setTargetAtTime(0.01,au.A.currentTime,0.05);
      pitStageTime = stageTime;
      pitStageRank = currentPlayerRank;
      pitOverallRank = overallRank;
      pitStartFuel = car.fuel;
      pitTargetFuel = Math.max(car.fuel,Math.min(getTankCapacity(),pitFuelPlan||getTankCapacity()));
      pitDuration = pitDurFor(car.fuel, pitTargetFuel);
      pitElapsed = 0;
      car.wheels = [1,1,1,1];
      car.hp = Math.min(100, car.hp + 15 * (1 + resV('fieldrep')) + 6 * resV('pit_crew'));
      altStageIdx++;
      altStageStartTime = totalNow + pitDuration;

function tmInterest(tm){return rep/Math.max(1,tm.reqRep)+(lastWMPos>0&&lastWMPos<=3?.3:lastWMPos>0&&lastWMPos<=6?.1:0)}
function tmTerms(i,n){
  const tm=TEAMS[i],cur=i===teamId,lvl=tmInterest(tm)>=1.5?2:tmInterest(tm)>=1.15?1:0;
  const bound=!cur&&teamContractSeasons>0;
  return{tm,cur,lvl,bound,ok:(devMode||(rep>=tm.reqRep&&i>=teamId))&&(n===2||lvl>0||cur||devMode),
    bonus:n===2?Math.round(tm.budgetBonus*[0,.04,.08][lvl]):0,
    loyalty:cur?Math.round(tm.budgetBonus*.04):0,
    buyout:bound?Math.round(TEAMS[teamId].budgetBonus*.25*teamContractSeasons):0};
}

/* Attract-Modus: Im Menü rollt der Wagen die aktuelle Strecke entlang, damit im
   Hintergrund echtes Gameplay zu sehen ist. Ohne Physik-, Wertungs- oder Speicherlogik. */
function menuDemo(dt){
  const n=pts.length;if(n<8)return;
  if(demoI<0||demoI>=n){demoI=Math.floor(n*(.08+Math.random()*.28));cameraReady=false}
  demoV=Math.min(300,demoV+dt*60);
  let a=pts[demoI%n],b=pts[(demoI+1)%n];
  let seg=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
  demoD+=demoV*dt;
  let guard=0;
  while(demoD>=seg&&guard++<8){
    demoD-=seg;demoI=(demoI+1)%n;
    a=pts[demoI];b=pts[(demoI+1)%n];
    seg=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
  }
  const t=Math.min(1,demoD/seg);
  car.x=a.x+(b.x-a.x)*t;car.y=a.y+(b.y-a.y)*t;
  const ang=Math.atan2(b.y-a.y,b.x-a.x);
  car.a=ang;car.z=0;car.vx=Math.cos(ang)*demoV;car.vy=Math.sin(ang)*demoV;
  const look=pts[(demoI+7)%n];
  let turn=Math.atan2(look.y-car.y,look.x-car.x)-ang;
  turn=Math.atan2(Math.sin(turn),Math.cos(turn));
  car.st=Math.max(-.8,Math.min(.8,turn*2.4));
  lanciaSteerInput=car.st*.6;
  idx=demoI;dist=0;
}

function update(dt){
  pauseBtnTick();
  if(paused)return;
  {const off=state==='intro'||state==='count';if(off!==cdHudOff){cdHudOff=off;document.body.classList.toggle('cd-hud-off',off)}}
  {const dm=state==='menu';if(dm!==mmDemoCls){mmDemoCls=dm;document.body.classList.toggle('mm-demo',dm)}}
  pollGamepad(dt);
  guideTipsTick();
  if(state==='pitstop'){
    t+=dt;
    pitElapsed=Math.min(pitDuration, pitElapsed+dt);
    const pRatio=pitElapsed/Math.max(0.1,pitDuration);
    car.fuel=pitStartFuel+(pitTargetFuel-pitStartFuel)*pRatio;
    updatePitstopLiveUI();
    if(pitElapsed>=pitDuration){
      window.startNextAltStage();
    }
    return;
  }
  if(state==='intro'){
    introT+=dt;
    // Nur drei Countdown-Beats: Die finale Chase-Einstellung läuft bereits bei "1".
    // Sobald sie die normale Verfolgerposition erreicht, beginnt bei "Los!" sofort das Rennen.
    const n=introT<INTRO_BEAT?'3':introT<INTRO_BEAT*2?'2':'1';
    if(n!==introBeep){introBeep=n;try{sndEvent('beep')}catch(e){}}
    const shot=introT<INTRO_BEAT?'WIDE SHOT · FRONT APPROACH':introT<INTRO_BEAT*2?'HARD CUT · CLOSE SIDE DETAIL':'HARD CUT · LOW CHASE CAM · READY';
    if(introHud){const countEl=introHud.querySelector('.ri-count'),shotEl=introHud.querySelector('.ri-shot');if(countEl&&countEl.textContent!==n){countEl.textContent=n;countEl.classList.remove('go');}if(shotEl&&shot!==introLastShot){shotEl.textContent=shot;introLastShot=shot;}}
    if(introT>=INTRO_LEN)endStartCinematic();
    return;
  }
  const play=state==='play';
  if(!play&&reverseGear)setReverseGear(false);
  chameleonTick(dt);
  let gas=0,brake=0,hb=0,tgt=0;
  if(play){
    gas=Math.max((keys.ArrowUp||keys.KeyW||touch.g)?1:0,padInput.gas);
brake=Math.max((keys.ArrowDown||keys.KeyS)?1:0,padInput.brake);
    if(brake>0.02)gas=0; // Die Bremse hat Vorrang vor dem Gas.
    hb=!!(keys.Space||touch.h||padInput.handbrake);
    const digitalSteer=((keys.ArrowRight||keys.KeyD||touch.r)?1:0)-((keys.ArrowLeft||keys.KeyA||touch.l)?1:0);
    tgt=Math.max(-1,Math.min(1,(digitalSteer+padInput.steer)*steerSens));
    if(resOverWant())gas=1;
  }
  // Wird in jedem Simulationsschritt aktualisiert, auch in Menü/Countdown:
  // so bleibt kein alter Lenkeinschlag als visueller Offset zurück.
  lanciaSteerInput=play?tgt:0;
  if(state==='count'){
    cdT-=dt;const n=Math.ceil(cdT);
    if(n!==cdLast){cdLast=n;if(n>0){big(n);sndEvent('beep')}else{big('Los!');sndEvent('gunshot');resLaunch=0;state='play';say('Los!')}}
  }
  if(state==='menu'&&!inGarage&&!inWM){menuDemo(dt);return}
  if(state==='menu'||state==='end')return;

  let bd=1e18,bi=idx;
  for(let i=Math.max(0,idx-15);i<Math.min(pts.length,idx+65);i++){
    const dx=pts[i].x-car.x,dy=pts[i].y-car.y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}
  }
  if(bd > 180*180){
    for(let i=0;i<pts.length;i++){
      const dx=pts[i].x-car.x,dy=pts[i].y-car.y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}
    }
  }
  idx=bi;dist=Math.sqrt(bd);
  resTick(dt);
  document.body.classList.toggle('hasOver',!!resV('works_engine'));
  if(resDay)resGateCheck();
  /* Fahrhilfen: Bremspunkt-Hinweis und automatisches Anbremsen enger Kehren. */
  if(play&&(assistLine||assistBrake)){
    const spdKmh=Math.hypot(car.vx,car.vy)*0.32;
    let tn=null;
    for(let i=0;i<notes.length;i++){const n=notes[i];if(n.isJump||!n.dir)continue;if(n.s>idx&&(n.s-idx)*STEP<300&&Math.abs(n.sv)>=2){tn=n;break}}
    const need=tn?Math.max(42,150-16*Math.abs(tn.sv)):0;
    const tooFast=!!tn&&spdKmh>need*1.15;
    if(assistHintEl&&assistLine){
      if(tooFast!==assistHintOn){assistHintOn=tooFast;assistHintEl.style.display=tooFast?'block':'none';assistHintEl.textContent=tooFast?'🛑 JETZT BREMSEN':' '}
    }else if(assistHintEl&&assistHintEl.style.display!=='none'){assistHintEl.style.display='none'}
    if(assistBrake&&tooFast&&tn){
      const d=(tn.s-idx)*STEP;
      if(d<220){brake=Math.max(brake,1);gas=0;}
    }
  }
  if(raceStats){
    const spNow=Math.hypot(car.vx,car.vy);
    if(spNow>raceStats.top)raceStats.top=spNow;
  }
  const on=dist<HW;
  const currP=pts[idx];
  const airborne = car.z > 0.5;

  const st=getCarStats(car.fuel, true);
  hudGearTopRef=Math.max(80,405*SPD_K*st.topSpd/st.aeroDrag);

  if(play){
    let burnRate = (0.10*(1-resV('fuel')) + 0.66*gas) * st.fuelRate;
    if(wmActive && wmIsFreeWeekend && altEventActive){
      /* Endurance: Verbrauch an die gefahrene Strecke gekoppelt (nicht an die Zeit),
         damit der Tank auch bei langsamerem Auto oder Umwegen bis ins Ziel reicht. */
      const spdNow = Math.hypot(car.vx, car.vy);
      /* ~90 L real verbrauchte Liter pro Etappe (vorher ~70 L bei 64 L Zielwert → 30 L Rest): bei Standardtank bleiben nur ~5–12 L Reserve.
         Wer Gas wegnimmt/rollt (30 % Verbrauch) spart Sprit, wer ständig am Limit fährt, muss besser haushalten. */
      const targetLiters = 84 * (0.95 + 0.06 * st.fuelRate) * (researched.fuel ? 0.96 : 1.0);
      const perUnit = targetLiters / Math.max(1, trackLen);
      burnRate = perUnit * spdNow * (0.3 + 0.7*gas) + (gas > 0.5 && spdNow < 40 ? 0.04*gas : 0);
    }
    /* Endurance: Notreserve – der Tank fällt nie unter 2 L, damit eine Etappe nicht kurz vor dem Ziel scheitert */
    car.fuel = Math.max((wmActive && wmIsFreeWeekend && altEventActive) ? 2 : 0, car.fuel - burnRate * dt);
    /* Endurance: Tank leer (Reserve 2 L) = Notlauf mit nur 45 % Gas – Spritstrategie hat echte Folgen */
    if(wmActive && wmIsFreeWeekend && altEventActive && car.fuel <= 2.05){
      gas *= 0.45;
      if(!car.limpWarn){car.limpWarn=true;toast('🚨 Tank leer – Notlauf! Nächstes Mal früher Gas wegnehmen.');say('Tank leer, Notlauf')}
    }
    if(car.fuel > 0 && car.fuel <= 8 && !car.lowFuelWarn){
      car.lowFuelWarn = true;
      toast('⛽ Reserve! Nur noch ' + Math.ceil(car.fuel) + ' L im Tank!');sndEvent('warn');
      say('Achtung, Tank fast leer');
    }
    if(car.fuel <= 0){
      gas = 0;
    }
  }

  const c=Math.cos(car.a),s=Math.sin(car.a);
  let vf=car.vx*c+car.vy*s,vr=-car.vx*s+car.vy*c;

  if(raceStats&&hb&&car.hbSlip<0.05)raceStats.hb=(raceStats.hb||0)+1;
  if(hb && !airborne){car.hbSlip=Math.min(1,car.hbSlip+dt*1.8)}else{car.hbSlip=Math.max(0,car.hbSlip-dt*2.2)}
  const sFactor=car.hbSlip*car.hbSlip*(3-2*car.hbSlip); /* sanfter Anstieg: kurzes Antippen wirkt schwach, langes Halten voll */

  const missL = (1-car.wheels[0]) + (1-car.wheels[2]);
  const missR = (1-car.wheels[1]) + (1-car.wheels[3]);
  const missTotal = missL + missR;
  const pullDir = (missR - missL) + (missTotal>0 && missR===missL ? Math.sin(t*9)*0.65 : 0);
  const wheelPenalty = Math.max(0.45, 1 - missTotal * 0.16);

  const dfSpeed = Math.min(1, Math.abs(vf) / 420);
  const downforce = 1 + (st.aero - 1) * 0.9 * dfSpeed;

  const accel = ACC_BASE * st.acc * wheelPenalty / st.wt;
  if(gas > 0 && !airborne){
    if(reverseGear){
      /* Rückwärtsgang: erst die Vorwärtsfahrt sauber abbauen, dann langsam
         und nur bis Schrittgeschwindigkeit zurücksetzen. */
      if(vf > 2) vf = Math.max(0, vf - 240 * dt * gas);
      else vf = Math.max(-REV_MAX, vf - accel * 0.28 * dt * gas);
    }else{
      vf += accel * dt * gas * (hb ? 0.85 : 1.0);
    }
  }
  if(brake > 0 && !airborne){
    /* Kräftig, aber nicht schlagartig verzögern. Die Bremse hält bei 0 an und
       leitet ohne eingelegten Rückwärtsgang keine Rückwärtsfahrt ein. */
    const bd = 120 + 60 * Math.min(1, Math.abs(vf) / 380);
    if(vf > 0) vf = Math.max(0, vf - bd * dt * brake);
    else if(vf < 0) vf = Math.min(0, vf + bd * 0.75 * dt * brake);
  }
  let slopeCap=1,slopeNow=0;
  if(trackSlopes){{const sr=trackSlopes[Math.min(trackSlopes.length-1,idx)]||0;slopeSm+=(sr-slopeSm)*Math.min(1,dt*4);slopeNow=slopeSm}if(!airborne)vf-=slopeNow*28*dt;slopeCap=1-slopeNow*.02;}
  {const he=document.getElementById('slopeHud');if(he){if(trackSlopes){const br=CT_BRUSH[Math.round(slopeNow)+2],k=br.ic+' '+br.n+' '+br.g;if(he._k!==k){he._k=k;he.textContent=k;he.style.borderColor=br.c}he.classList.add('on')}else he.classList.remove('on')}}
  
  /* Schwache Beschleunigung darf das Höchsttempo nicht per Luftwiderstand deckeln: Drag wird so begrenzt, dass der Deckel erreichbar bleibt (dauert dann nur länger). */
  const capRef = 348.3 * st.topSpd * wheelPenalty / st.aeroDrag;
  const dragOn = Math.min(0.62 * st.aeroDrag / st.topSpd, accel / (1.02 * capRef));
  let drag = airborne ? 0.25 : (on ? dragOn : 2.0);
  if(!airborne && !on && dist > HW + 75) drag = 3.2;
  if(!airborne) drag += missTotal * 0.35;
  vf *= Math.exp(-(drag + (airborne ? 0 : 0.38 * sFactor)) * dt);

  const aeroStraightPenalty = Math.max(0,st.aero-1)*0.055*Math.min(1,Math.abs(vf)/260);
  const maxVf = 405 * SPD_K * st.topSpd * wheelPenalty / (st.aeroDrag*(1+aeroStraightPenalty));
  if(vf > maxVf*slopeCap) vf = maxVf*slopeCap;
  if(vf < -160) vf = -160;

  const wGrip = Math.min(1.05, (WEATHERS[weather] ? WEATHERS[weather].gr : 1.0) * st.tireMatch.weatherComp);
  const surfaceBase = on ? 8.5 : (4.8 * st.tireMatch.offMult);
  // Fahrverhalten: etwas weniger Seitenführung, trägeres Einlenken und
  // stärkeres Giermoment bei vorhandenem Seitenschlupf (spürbares Übersteuern).
  const grip = airborne ? 1.2 : Math.max(0.6, (surfaceBase * st.grip * downforce * Math.max(0.5, 1 - missTotal*0.15)) - (6.4 * sFactor));
  // Das Verbund-Monocoque tauscht bei der Abstimmung Crash-Schutz gegen Kurvenstabilität (Seitenführung).
  const stabilityAtSpeed=st.compositeStability||1;
  const lateralGrip = grip * 0.82 * stabilityAtSpeed;
  vr *= Math.exp(-lateralGrip * wGrip * BI.gr * dt);

  // Lenkung baut langsamer auf und hat etwas weniger Wirkung.
  car.st += (tgt - car.st) * Math.min(1, 7.5 * dt);
  /* Untersteuern: je schneller, desto weniger Lenkwirkung. Die Handbremse hebt das auf und dreht das Heck stark ein -> in engen Kurven noetig. */
  const underSt = airborne ? 1 : (1 - 0.28 * Math.min(1, Math.abs(vf) / 330) * (1 - sFactor));
  /* Handbremsen-Drehung ans Setup angepasst: Starter-Auto (turn~0.52) = Referenz; staerkere Chassis/schnellere Autos bekommen nur abgeschwaechten Zuwachs */
  const hbT = 0.52 * Math.pow(Math.max(0.3, st.turn) / 0.52, 0.25) / Math.pow(Math.max(1, st.topSpd), 0.7);
  let turnSpeed = (airborne ? 0.55 : 2.05) * 0.88 * underSt * (st.turn + 1.5 * sFactor * hbT);
  let turn = car.st * turnSpeed * Math.min(1, Math.abs(vf) / 90) * (vf < 0 ? -1 : 1);
  // Seitenschlupf dreht das Fahrzeug stärker in die Drift-Richtung -> mehr Übersteuern.
  if(vf > 10 && !airborne) turn += Math.atan2(vr, vf + 160) * (3.0 - 2.3 * sFactor);

  if(missTotal > 0 && Math.abs(vf) > 15 && !airborne){
    const spdFactor = Math.min(1.2, Math.abs(vf) / 140) * (vf < 0 ? -1 : 1);
    turn += pullDir * 1.18 * spdFactor;
    vr += pullDir * 105 * dt * Math.min(1, Math.abs(vf) / 110);
  }

  car.vx = c * vf - s * vr; 
  car.vy = s * vf + c * vr;
  car.a += turn * dt; 
  const moveStartX=car.x,moveStartY=car.y;
  car.x += car.vx * dt; 
  car.y += car.vy * dt;
  { // Raddrehung: Phase folgt der Vorwärtsgeschwindigkeit; Handbremse blockiert die Hinterräder
    const wStep=vf*dt*0.12;
    car.wpF=((car.wpF||0)+wStep)%1000;
    if(!(play&&hb&&Math.abs(vf)>0))car.wpR=((car.wpR||0)+wStep)%1000;
  }

  if(car.z <= 0){
    for(const r of ramps){
      if(!r.used && Math.abs(idx - r.idx) <= 9 && dist < HW * 0.85 && vf > 110){
        const alR=(car.x-r.x)*Math.cos(r.h)+(car.y-r.y)*Math.sin(r.h);
        if(alR<38||alR>120)continue;
        r.used = true;
        car.z = 1.5;
        car.vz = Math.min(240, Math.max(125, vf * 0.52));
        car.vz = Math.max(70, Math.min(car.vz, r.room * 230 / Math.max(vf, 110)));
        toast('🚀 Sprung!');sndEvent('jump');
        break;
      }
    }
  }
  if(car.z > 0 || car.vz > 0){
    car.z += car.vz * dt;
    car.vz -= 460 * dt;
    if(car.z <= 0){
      car.z = 0;
      car.vz = 0;
      sndEvent('land');
      for(let i=0;i<10;i++){
        fx.push({x:car.x+(Math.random()-.5)*24,y:car.y+(Math.random()-.5)*24,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,col:'rgba(210,190,150,.65)',sz:4+Math.random()*4,life:0.32});
      }
    }
  }
  
  const sp = Math.hypot(car.vx, car.vy);
  if(play){
    const speedRatio=sp/(500*SPD_K*st.topSpd/st.aeroDrag);
    runMaxRatio=Math.max(runMaxRatio,speedRatio);
    if(activeQuest&&(activeQuest.id==='speed'||activeQuest.id==='end_speed')){
      const holdRatio=activeQuest.targetRatio||0.65, holdTarget=activeQuest.holdSeconds||5;
      speedHoldSeconds=speedRatio>=holdRatio?Math.min(holdTarget,speedHoldSeconds+dt):0;
    }
    if(airborne&&!runAirFlag)runAirFlag=true;
    else if(!airborne&&runAirFlag){runAirFlag=false;runJumps++;if(resV('cooling')){resBoost=2.5;toast('🌬️ Druckspeicher-Turbo!')}}
  }
  if(play)resSpecials(dt,gas,vf,vr,on,airborne,st);
  hitCd -= dt; softCd -= dt; 
  cutCd -= dt;

  if(play && car.fuel <= 0 && sp < 18){
    triggerDNF('Tank leer (Kein Sprit mehr)');
    return;
  }

  if(missTotal > 0 && sp > 40){
    const wOff=[[17,-15],[17,15],[-17,-15],[-17,15]];
    for(let w=0;w<4;w++){
      if(!car.wheels[w] && Math.random()<0.55){
        const wx=car.x+c*wOff[w][0]-s*wOff[w][1], wy=car.y+s*wOff[w][0]+c*wOff[w][1];
        fx.push({x:wx,y:wy,vx:-car.vx*0.2+(Math.random()-.5)*70,vy:-car.vy*0.2+(Math.random()-.5)*70,col:Math.random()<.5?'#ff9900':'#ffee77',sz:2.5,life:0.25});
      }
    }
  }
  if(car.hp < 55 && Math.random() < (60-car.hp)*0.012){
    fx.push({x:car.x+c*18,y:car.y+s*18,vx:(Math.random()-.5)*35,vy:(Math.random()-.5)*35,col:car.hp<25?'rgba(30,30,30,.65)':'rgba(90,90,95,.45)',sz:6+Math.random()*6,life:0.6});
  }

  // Sicherheitsgrenzen: kurzlebige Effekte dürfen bei langen Rennen nicht anwachsen.
  if(debris.length>90) debris.splice(0,debris.length-90);
  if(fx.length>260) fx.splice(0,fx.length-260);
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.a+=d.va*dt;
    d.vx*=Math.exp(-1.4*dt); d.vy*=Math.exp(-1.4*dt);
    d.life-=dt;
    if(d.life<=0) debris.splice(i,1);
  }
  for(let i=fx.length-1;i>=0;i--){
    const p=fx[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0) fx.splice(i,1);
  }

  let curNote = null, tightNote = null;
  for(const n of notes){
    if(!n.isJump && idx>=n.s && idx<=n.e){
      curNote=n;
      if(n.isTight) tightNote=n;
      break;
    }
  }

  const nx = -Math.sin(currP.h), ny = Math.cos(currP.h);
  const lat = (car.x - currP.x)*nx + (car.y - currP.y)*ny;

  if(state==='play' && !airborne && curNote && (lat * (curNote.chic&&idx>=curNote.mid?-curNote.dir:curNote.dir)) > HW + 14 && vf > 75){
    cutTime += dt;
    resClean=0;
    // Der Ingenieur meldet jeden neuen Cutting-Vorfall sofort, nicht nur wenn die Gnadenfrist verfügbar ist.
    if(cutTime > 0.03 && !cutWarned && resV('prize_nego')){
      cutWarned=true;
      toast('🎙️ Ingenieur: Achtung, Corner Cutting! Zurück auf die Strecke!');
      say('Achtung, Corner Cutting. Zurück auf die Strecke');
    }
    if(cutTime > 0.18 && cutCd <= 0 && resV('prize_nego') && resGrace <= 0 && resGraceCd <= 0){
      resGrace = 3*resV('prize_nego'); resGraceCd = 10; cutTime = 0;
      toast("🎙️ Ingenieur: Cutting! Tempo raus, zurück auf die Linie – "+resGrace.toFixed(1)+" s!");
      say("Achtung Abkürzung, Tempo raus");
    } else if(resGrace > 0){
      cutTime = Math.min(cutTime, 0.1);
    } else if(cutTime > 0.18 && cutCd <= 0){
      pen += 3;
      cutCd = 1.6;
      cutTime = 0;
      toast("⚠️ Corner Cutting! +3 s Strafe");
      say("Abgekürzt, drei Sekunden Strafe");
    }
  }else{
    cutTime = Math.max(0, cutTime - dt*2);
    cutWarned=false;
    if(resGrace > 0){
      resClean += dt;
      if(resClean >= 0.5){resGrace = 0; resClean = 0; toast("🎙️ Ingenieur: Sauber zurück – Strafe vermieden! ✅"); say("Strafe vermieden");}
    }
  }

  if (currP.cv && Math.abs(lat) > HW-10) {
    pushFromWall("Höhlenwand", HW-10, nx, ny, lat);
  } else if (!airborne && tightNote && (lat * (-tightNote.dir)) > HW-6) {
    pushFromWall("Bande", HW-6, nx, ny, lat);
  }

  function applyImpactDamage(sourceName, impactSpd, hitSide, isWall=false){
    if(hitCd > 0 || state !== 'play') return;
    resCalm=0;

    if(isWall && impactSpd < 95){
      hitCd = 0.9;
      const scrapeDmg = impactSpd < 40 ? 1 : 3;
      car.hp = Math.max(0, car.hp - scrapeDmg);
      if(raceStats)raceStats.scrapes++;
      sndEvent('scrape');
      if(car.hp <= 0) triggerDNF(sourceName + "-Schaden");
      return;
    }

    hitCd = 1.1;
    const hpBefore = car.hp;
    const baseDmg = isWall
      ? Math.max(4, Math.round(3 + (impactSpd / 420) * 12))
      : Math.max(8, Math.round(8 + (impactSpd / 420) * 26));
    let dmM=st.dmgMult;if(resShield>0&&resV('skidplate')&&baseDmg>=5){resShield--;dmM*=1-0.8*resV('skidplate');toast('🛡️ Crashbox fängt den Aufprall ab')}
    const dmg = Math.max(2, Math.round(baseDmg * dmM));
    car.hp = Math.max(0, car.hp - dmg);
    if(raceStats)raceStats.crashes++;
    sndEvent('crash',dmg);

    let lostWheel = false;
    const currentMissing = 4 - (car.wheels[0]+car.wheels[1]+car.wheels[2]+car.wheels[3]);
    const wheelThreshold = (isWall ? 265 : 210) + 45*resV('lugnuts');
    
    if(impactSpd > wheelThreshold && currentMissing < 2 && hpBefore <= 70 && car.hp <= 70){
      const res = detachWheel(hitSide);
      if(res !== false){
        lostWheel = true;
        const wNames=['Vorne Links','Vorne Rechts','Hinten Links','Hinten Rechts'];
        toast("💥 Rad ab ("+wNames[res]+")! Drall! -"+dmg+"%");
        say("Reifen verloren!");
      }
    }
    if(!lostWheel){
      toast("💥 "+sourceName+"! -"+dmg+"% Zustand");
    }

    if(car.hp <= 0){
      car.hp = 0;
      triggerDNF(sourceName + "-Aufprall");
    }
  }

  function pushFromWall(sourceName, maxLat, nx, ny, lat){
    const sd = lat > 0 ? 1 : -1;
    const over = Math.abs(lat) - maxLat;
    car.x -= nx * sd * over;
    car.y -= ny * sd * over;
    const vn = (car.vx*nx + car.vy*ny)*sd;
    const impactSpd = Math.max(0, vn) * 1.15;
    if(vn > 0){
      car.vx -= 1.08 * vn * nx * sd;
      car.vy -= 1.08 * vn * ny * sd;
    }
    const damp = vn > 90 ? 0.84 : 0.96;
    car.vx *= damp; car.vy *= damp;
    if(Math.hypot(car.vx, car.vy) > 60 && Math.random() < 0.5){
      fx.push({x:car.x+nx*sd*14,y:car.y+ny*sd*14,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,col:'#ffae00',sz:2.5,life:0.22});
    }
    const carSide = ((-s)*nx*sd + c*ny*sd) >= 0 ? 1 : -1;
    applyImpactDamage(sourceName, impactSpd, carSide, true);
  }

  if(!airborne){
    // Kontinuierliche Sweep-Prüfung: Hindernisse werden analytisch entlang der
    // Bewegungsstrecke geprüft. Das ersetzt bis zu 72 Einzelabfragen pro Frame.
    const sweepX=car.x-moveStartX,sweepY=car.y-moveStartY,travel2=sweepX*sweepX+sweepY*sweepY,travel=Math.sqrt(travel2);
    if(travel2>1e-8){
      let bestT=2,hit=null,softHit=null,softT=2;
      const broad=VEHICLE_COLLISION_RADIUS+84;
      const bx0=Math.floor((Math.min(moveStartX,car.x)-broad)/SOLID_CELL),bx1=Math.floor((Math.max(moveStartX,car.x)+broad)/SOLID_CELL);
      const by0=Math.floor((Math.min(moveStartY,car.y)-broad)/SOLID_CELL),by1=Math.floor((Math.max(moveStartY,car.y)+broad)/SOLID_CELL);
      const testSolidList=list=>{
        for(const ob of list){
          if(ob.soft){
            // Weiches Hindernis: nur Kontakt merken, niemals die Position klemmen.
            // Der Kontaktradius ist kleiner, damit die Fahrbahn selbst frei bleibt.
            const Rs=ob.r*.62+10,smx=moveStartX-ob.x,smy=moveStartY-ob.y,sc=smx*smx+smy*smy-Rs*Rs;
            let su=0;
            if(sc>0){
              const sb=smx*sweepX+smy*sweepY,sdisc=sb*sb-travel2*sc;
              if(sdisc<0)continue;
              su=(-sb-Math.sqrt(sdisc))/travel2;
              if(su<0||su>1)continue;
            }
            if(su<softT){softT=su;const spx=moveStartX+sweepX*su,spy=moveStartY+sweepY*su;softHit={x:ob.x,y:ob.y,r:ob.r,kind:ob.kind,wall:false,px:spx,py:spy,dx:spx-ob.x,dy:spy-ob.y};}
            continue;
          }
          const mx=moveStartX-ob.x,my=moveStartY-ob.y,R=ob.r+VEHICLE_COLLISION_RADIUS,c=mx*mx+my*my-R*R;
          let u=0;
          if(c>0){
            const b=mx*sweepX+my*sweepY,disc=b*b-travel2*c;
            if(disc<0)continue;
            u=(-b-Math.sqrt(disc))/travel2;
            if(u<0||u>1)continue;
          }
          if(u<bestT){bestT=u;const px=moveStartX+sweepX*u,py=moveStartY+sweepY*u;hit={x:ob.x,y:ob.y,r:R,kind:ob.kind,wall:false,px:ob.x,py:ob.y,dx:px-ob.x,dy:py-ob.y};}
        }
      };
      if(solidGridReady){
        for(let gx=bx0;gx<=bx1;gx++)for(let gy=by0;gy<=by1;gy++){
          const bucket=solidGrid.get(gx+','+gy);if(bucket)testSolidList(bucket);
        }
      }else testSolidList(solidColliders);

      // Zaunsegmente liegen in mehreren Grid-Zellen. Ein Set verhindert
      // Mehrfachtests desselben Segments; die Annäherung nutzt höchstens 18 m Schritte.
      if(fenceCollisionActive&&fenceGrid.size){
        const seenFences=new Set(),fSteps=Math.max(1,Math.ceil(travel/18));
        for(let gx=bx0;gx<=bx1;gx++)for(let gy=by0;gy<=by1;gy++){
          const bucket=fenceGrid.get(gx+','+gy);if(!bucket)continue;
          for(const f of bucket){
            if(seenFences.has(f))continue;seenFences.add(f);
            const fsx=f.bx-f.ax,fsy=f.bz-f.az,seg2=fsx*fsx+fsy*fsy||1,R=(f.r||15)+VEHICLE_COLLISION_RADIUS;
            for(let stp=0;stp<=fSteps;stp++){
              const u=stp/fSteps;if(u>=bestT)break;
              const tx=moveStartX+sweepX*u,ty=moveStartY+sweepY*u;
              const fu=Math.max(0,Math.min(1,((tx-f.ax)*fsx+(ty-f.az)*fsy)/seg2));
              const px=f.ax+fsx*fu,py=f.az+fsy*fu,dx=tx-px,dy=ty-py;
              if(dx*dx+dy*dy<R*R){
                if(f.soft){
                  const rs=12,drx=tx-px,dry=ty-py;
                  if(drx*drx+dry*dry<rs*rs){
                    if(u<softT){softT=u;softHit={x:px,y:py,r:15.5,kind:'Holzzaun',wall:true,px,py,dx,dy};}
                    break;
                  }
                  continue;
                }
                bestT=u;hit={x:px,y:py,r:R,kind:'Holzzaun',wall:true,px,py,dx,dy};break;
              }
            }
          }
        }
      }
      if(hit){
        let nx,ny,d=Math.hypot(hit.dx,hit.dy);
        if(d>1e-5){nx=hit.dx/d;ny=hit.dy/d;}
        else if(travel>1e-5){nx=-sweepX/travel;ny=-sweepY/travel;}
        else{nx=Math.cos(car.a);ny=Math.sin(car.a);}
        car.x=hit.px+nx*(hit.r+1.5);car.y=hit.py+ny*(hit.r+1.5);
        const vn=car.vx*nx+car.vy*ny,impactSpd=Math.max(0,-vn)*1.18;
        if(vn<0){const impulse=1.18*vn;car.vx-=impulse*nx;car.vy-=impulse*ny;}
        const vN=car.vx*nx+car.vy*ny,txv=car.vx-vN*nx,tyv=car.vy-vN*ny;
        car.vx=vN*nx+txv*.78;car.vy=vN*ny+tyv*.78;car.vx*=.96;car.vy*=.96;
        const carSide=((-s)*(-nx)+c*(-ny))>=0?1:-1;
        applyImpactDamage(hit.kind,impactSpd,carSide,hit.wall);
        if(hit.wall&&Math.random()<.55)fx.push({x:hit.px,y:hit.py,vx:nx*18+(Math.random()-.5)*35,vy:ny*18+(Math.random()-.5)*35,col:'#ffd45a',sz:2.8,life:.24});
        else if(Math.random()<.7)fx.push({x:car.x,y:car.y,vx:nx*16+(Math.random()-.5)*30,vy:ny*16+(Math.random()-.5)*30,col:'#b8a58a',sz:3+Math.random()*2,life:.28});
      }else if(softHit&&softCd<=0&&state==='play'){
        // Durchfahren statt Anstoßen: spürbarer Tempo- und kleiner Zustandsverlust.
        softCd=.55;
        const spdNow=Math.hypot(car.vx,car.vy);
        const give=Math.max(.72,1-softHit.r*.008);
        car.vx*=give;car.vy*=give;
        const dmg=spdNow>45?Math.max(1,Math.min(4,Math.round((1+spdNow/130)*st.dmgMult))):0;
        if(dmg>0){
          car.hp=Math.max(0,car.hp-dmg);
          if(raceStats)raceStats.scrapes++;
          for(let k=0;k<7;k++)fx.push({x:softHit.px+(Math.random()-.5)*22,y:softHit.py+(Math.random()-.5)*22,vx:(Math.random()-.5)*95,vy:(Math.random()-.5)*95,col:softHit.wall?'#c9a878':'#8fbe63',sz:2.2+Math.random()*2.4,life:.34});
          if(softHit.wall&&Math.random()<.3)toast('🪵 '+softHit.kind+' durchbrochen · -'+dmg+'%');
          else if(spdNow>150&&Math.random()<.18)toast('🌿 '+softHit.kind+' durchpflügt · -'+dmg+'%');
          if(car.hp<=0){car.hp=0;triggerDNF(softHit.kind+'-Kontakt');}
        }
      }
    }
  }

  // Auf sehr steilen Geländeflanken kann das Fahrzeug nicht weiter bergauf fahren.
  // Die 3D-Fahrzeughöhe folgt zusätzlich der tatsächlichen Terrainoberfläche (carY()).
  if(!airborne&&dist>HW+36&&typeof tH==='function'&&rh.length>=6){
    const gx=(tH(car.x+14,car.y)-tH(car.x-14,car.y))/28;
    const gy=(tH(car.x,car.y+14)-tH(car.x,car.y-14))/28;
    const grade=Math.hypot(gx,gy);
    if(grade>1.18){
      const ux=gx/grade,uy=gy/grade,vUp=car.vx*ux+car.vy*uy;
      if(vUp>8){car.x=moveStartX;car.y=moveStartY;car.vx-=vUp*ux;car.vy-=vUp*uy;car.vx*=.88;car.vy*=.88;

    }
  }

  const rx=car.x-c*18,ry=car.y-s*18,lx=rx+s*12,ly=ry-c*12,qx=rx-s*12,qy=ry+c*12;
  const isOffroad = dist > HW - 6;
  if(raceStats&&isOffroad&&!airborne&&state==='play')raceStats.offroad+=dt;
  if(!airborne && ((isOffroad && sp > 25) || (Math.abs(vr) > 80 && sp > 105))){
    if(pL){marks.push([pL.x,pL.y,lx,ly,isOffroad?1:0],[pR.x,pR.y,qx,qy,isOffroad?1:0]);if(marks.length>600)marks.splice(0,2)}
    pL={x:lx,y:ly};pR={x:qx,y:qy};
  }else pL=pR=null;

  sfx(sp,Math.abs(vr),gas,{r:sp/(405*SPD_K*st.topSpd/st.aeroDrag),off:isOffroad,air:airborne,hp:car.hp});
  if(state!=='play')return;
  t+=dt;
  if(activeQuest)renderQuestHUD();

  const q=Math.floor(idx/pts.length*4);
  if(q>=nextSplit&&nextSplit<4){
    const sv=t+pen;splits.push(sv);
    const bKey=currentTrackKey(),bRec=bestTimes[bKey];
    const bSplit=bRec&&bRec.splits&&Number.isFinite(bRec.splits[splits.length-1])?bRec.splits[splits.length-1]:null;
    toast('Zwischenzeit '+fmt(sv)+(bSplit!==null?' · '+(sv<=bSplit?'−':'+')+Math.abs(sv-bSplit).toFixed(1)+' s zur Bestzeit':''));
    nextSplit++;
  }

  for(let i=0;i<notes.length;i++){
    const n=notes[i];
    if(!n.said&&(n.s-idx)*STEP<720&&n.e>idx){
      n.said=true;
      if(n.isJump||n.sv>3||!n.dir)continue;
      let txt=noteTxt(n);
      if(!/^(Links|Rechts)( lang)?$/.test(txt))continue;
      const m=notes[i+1];
      if(m&&(m.s-n.e)*STEP<170&&!m.isJump&&m.sv<=3&&m.dir){const next=noteTxt(m);if(/^(Links|Rechts)( lang)?$/.test(next)){m.said=true;txt+=', dann '+next}}
      say(txt);break;
    }
  }
  const finIdx = Math.max(4, pts.length - 12);
  const fp = pts[finIdx];
  const fProj = (car.x - fp.x)*Math.cos(fp.h) + (car.y - fp.y)*Math.sin(fp.h);
  const fLat = Math.abs(-(car.x - fp.x)*Math.sin(fp.h) + (car.y - fp.y)*Math.cos(fp.h));
  if(idx >= finIdx || (idx >= finIdx - 30 && fProj >= 0 && fLat < HW * 3.5)) finish();
}

function updateNotes(){

  if(nk.n===notes&&nk.i===idx&&nk.s===state&&nk.a===altStageIdx)return;
  nk.n=notes;nk.i=idx;nk.s=state;nk.a=altStageIdx;
  const up=[];for(const n of notes){if(n.e>idx){up.push(n);if(up.length===3)break}}
  let h='';
  up.forEach((n,i)=>{
    const d=Math.max(0,(n.s-idx)*STEP)*.25;
    const txt=idx>=n.s?'jetzt':Math.round(d/10)*10+' m';
    h+=noteHtml(n,i===0,txt);
  });
  if(!up.length){
    const finIdx=Math.max(4,pts.length-12);
    const rem=Math.max(0,Math.round((finIdx-idx)*STEP*.25/10)*10);
    const isInterStage = !!(wmActive && wmIsFreeWeekend && altEventActive && altStageIdx < altEventActive.stages.length - 1);
    if(isInterStage){
      h='<div class="n main" style="--c:#4fd8ff"><div class="a">⛽ Tankstopp</div><div class="d">'+(rem>0?rem+' m':'In die Box!')+'</div><div class="t">Etappe '+(altStageIdx+1)+'</div></div>';
    }else{
      h='<div class="n main" style="--c:#5fd68a"><div class="a">🏁 Ziel</div><div class="d">'+(rem>0?rem+' m':'Vollgas!')+'</div></div>';

  if(h!==lastNoteHtml){$('notes').innerHTML=h;lastNoteHtml=h}
}

let last=performance.now();
let fAvg=16.7,qCool=2400,qBack=7000;
let lastFrameFault='';
function frame(now){
  if(gfxFpsCap>0&&now-last<1000/gfxFpsCap-2){requestAnimationFrame(frame);return}
  const raw=Math.max(0,Math.min(250,now-last)),real=raw/1000;
  last=now;frameDt=Math.min(.05,Math.max(.001,real));if(gfxShowFps)gxFpsTick(now);
  try{
    /* Adaptive Qualitaet: bei anhaltend niedriger Framerate die Render-Aufloesung senken */
    fAvg+=(Math.min(raw,100)-fAvg)*.075;qCool-=raw;
    if(qCool<=0&&!document.hidden&&gfxAutoQ){
      if(fAvg>20&&qMul>gfxQMin()){qMul=Math.max(gfxQMin(),qMul-.10);qBack=Math.min(60000,qBack*1.6);qCool=2200;resize()}
      else if(fAvg<17.5&&qMul<1){qMul=Math.min(1,qMul+.08);qCool=qBack;resize()}
      else qCool=1000;
    }
    /* Reale Zeit in festen Schritten nachholen. Früher war dt auf 33 ms begrenzt:
       unter ~30 fps lief die Simulation dadurch in Zeitlupe (Tacho zeigte Tempo,
       die Welt bewegte sich aber langsamer) – im Cockpit besonders auffällig, weil
       dort mehr Renderlast anliegt. */
    simAcc=Math.min(.14,simAcc+real);
    let simSteps=0;
    while(simAcc>.004&&simSteps<4){
      const sdt=Math.min(.033,simAcc);
      simAcc-=sdt;simSteps++;
      try{update(sdt)}catch(e){
        const msg=String(e&&e.stack||e);
        if(msg!==lastFrameFault){console.error('Fehler in der Spielsimulation:',e);lastFrameFault=msg}
      }
    }
    try{draw()}catch(e){
      const msg=String(e&&e.stack||e);
      if(msg!==lastFrameFault){console.error('Fehler beim Zeichnen:',e);lastFrameFault=msg}
    }
  }catch(e){
    const msg=String(e&&e.stack||e);
    if(msg!==lastFrameFault){console.error('Fehler in der Hauptschleife:',e);lastFrameFault=msg}
  }finally{
    requestAnimationFrame(frame);
  }
}

/* ===== Flutlicht-Pool =====

}
let roadBulbMat=null;
function updFloods(){
  const n=FLOOD_POOL.length,icv=caveBlendCam(idx),nf=tod===2?1:tod===1?.45:0;
  if(roadBulbMat)roadBulbMat.color.setRGB(.2+.8*nf,.19+.69*nf,.16+.45*nf);
  if(!n)return;
  const ah=icv>.3?90:320,fx=car.x+Math.cos(car.a)*ah,fz=car.y+Math.sin(car.a)*ah,m=FLOOD_SPOTS.length;let cnt=0;
  const gf=nf*(1-icv),gr=nf*(1-icv),gc=sm(.04,.5,icv);
  for(let i=0;i<m;i++){
    const s=FLOOD_SPOTS[i],g=s.t==='c'?gc:s.t==='r'?gr:gf;if(g<.01)continue;
    const dx=s.x-fx,dz=s.z-fz,d=dx*dx+dz*dz,F=FLP[s.t],bb=F.b*F.b;if(d>bb)continue;

      _fbD[p]=d;_fbI[p]=i;if(cnt<n)cnt++;

}

/* ===== Räumliches Chunking statischer Instanz-Meshes =====
   Bäume, Felsen, Zäune, Zuschauer usw. waren je EIN riesiger InstancedMesh über die ganze Strecke mit
   frustumCulled=false -> jeden Frame (auch im Schattenpass) wurde die komplette Strecke gezeichnet.
   Jetzt werden Instanz-Meshes in ~420er-Blöcke zerlegt; Kamera- und Schatten-Frustum
   sortieren alles Unsichtbare aus. Zusätzlich werden Blöcke jenseits der Nebelgrenze ausgeblendet. */
let CHK=[];
function chunkInstances(root){
  CHK=[];
  if(typeof T.InstancedMesh.prototype.computeBoundingSphere!=='function')return;
  const CELL=420,MINN=32,list=[],small=[];
  root.traverse(o=>{if(o.isInstancedMesh&&o.count){if(o.count>=MINN)list.push(o);else small.push(o)}});
  const register=(m,visible)=>{const b=m.boundingSphere;if(m.parent===root&&!(m.material&&m.material.fog===false))CHK.push({m,v0:visible,x:b.center.x,z:b.center.z,r:b.radius})};
  for(const m of small){
    m.frustumCulled=true;m.computeBoundingSphere();register(m,m.visible);
  }
  for(const m of list){
    const par=m.parent;if(!par)continue;
    const n=m.count,a=m.instanceMatrix.array,ic=m.instanceColor?m.instanceColor.array:null,groups=new Map();
    for(let i=0;i<n;i++){
      const key=(Math.floor(a[i*16+12]/CELL)+4000)*10000+Math.floor(a[i*16+14]/CELL)+4000;
      let g=groups.get(key);if(!g){g=[];groups.set(key,g)}g.push(i);
    }
    const noFogCull=!!(m.material&&m.material.fog===false);
    if(groups.size<2){m.frustumCulled=true;m.computeBoundingSphere();register(m,m.visible);continue}
    par.remove(m);
    for(const idx of groups.values()){
      const k=idx.length,c=new T.InstancedMesh(m.geometry,m.material,k),ca=c.instanceMatrix.array;
      let cc=null;if(ic){cc=new Float32Array(k*3);c.instanceColor=new T.InstancedBufferAttribute(cc,3)}
      for(let q=0;q<k;q++){
        const s0=idx[q]*16,d0=q*16;for(let e=0;e<16;e++)ca[d0+e]=a[s0+e];
        if(cc){cc[q*3]=ic[idx[q]*3];cc[q*3+1]=ic[idx[q]*3+1];cc[q*3+2]=ic[idx[q]*3+2]}
      }
      c.instanceMatrix.needsUpdate=true;if(c.instanceColor)c.instanceColor.needsUpdate=true;
      c.castShadow=m.castShadow;c.receiveShadow=m.receiveShadow;c.renderOrder=m.renderOrder;c.name=m.name;c.layers.mask=m.layers.mask;
      c.frustumCulled=true;c.computeBoundingSphere();par.add(c);register(c,m.visible);
    }
  }
}
function cullChunks(){
  if(!CHK.length)return;
  const lim=S.fog.far*1.45,cx=cam3.position.x,cz=cam3.position.z;
  for(let i=0;i<CHK.length;i++){const e=CHK[i],dx=e.x-cx,dz=e.z-cz,L=lim+e.r;e.m.visible=e.v0&&dx*dx+dz*dz<L*L}
}

function addPrismXZ(group,outline,y,thickness,material){
  const n=outline.length,verts=[];
  for(const p of outline)verts.push(p[0],y+thickness*.5,p[1]);
  for(const p of outline)verts.push(p[0],y-thickness*.5,p[1]);
  const idx=[];
  for(let i=1;i<n-1;i++){idx.push(0,i,i+1);idx.push(n,n+i+1,n+i);}
  for(let i=0;i<n;i++){const j=(i+1)%n;idx.push(i,j,n+j,i,n+j,n+i);}
  const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();
  const mat=material.clone();mat.side=T.DoubleSide;const mesh=new T.Mesh(geo,mat);mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);return mesh;
}
function addPrismXY(group,outline,z,thickness,material){
  const n=outline.length,verts=[];
  for(const p of outline)verts.push(p[0],p[1],z+thickness*.5);
  for(const p of outline)verts.push(p[0],p[1],z-thickness*.5);
  const idx=[];
  for(let i=1;i<n-1;i++){idx.push(0,i,i+1);idx.push(n,n+i+1,n+i);}
  for(let i=0;i<n;i++){const j=(i+1)%n;idx.push(i,j,n+j,i,n+j,n+i);}
  const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();
  const mat=material.clone();mat.side=T.DoubleSide;const mesh=new T.Mesh(geo,mat);mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);return mesh;
}
function addCamberedWing(group,xCenter,yBase,span,chord,material,accentMaterial,segments=18){
  const rows=10,cols=segments,positions=[],indices=[];
  for(let side=0;side<2;side++){
    for(let iz=0;iz<=rows;iz++){
      const v=iz/rows,z=(v-.5)*span;
      for(let ix=0;ix<=cols;ix++){
        const u=ix/cols,x=xCenter+(u-.5)*chord;
        const camber=.30*Math.sin(Math.PI*u),thickness=.16*Math.sin(Math.PI*u)*(1-.10*Math.abs(v-.5)*2);
        positions.push(x,yBase+camber+(side===0?thickness:-thickness),z);
      }
    }
  }
  const layer=(rows+1)*(cols+1);
  for(let side=0;side<2;side++){
    const off=side*layer;
    for(let iz=0;iz<rows;iz++)for(let ix=0;ix<cols;ix++){
      const a=off+iz*(cols+1)+ix,b=a+1,c=a+cols+1,d=c+1;
      if(side===0)indices.push(a,c,b,b,c,d);else indices.push(a,b,c,b,d,c);
    }
  }
  const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(positions,3));geo.setIndex(indices);geo.computeVertexNormals();
  const mat=material.clone();mat.side=T.DoubleSide;const blade=new T.Mesh(geo,mat);blade.castShadow=true;blade.receiveShadow=true;group.add(blade);
  // Dünne farbige Abschlusskante über die gesamte Spannweite.
  addTubeBetween(group,[xCenter-chord*.46,yBase-.01,-span*.5],[xCenter-chord*.46,yBase-.01,span*.5],.085,accentMaterial);
  return blade;
}

function ghostPosAt(dist,cd){
  let lo=0,hi=cd.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(cd[mid]<dist)lo=mid+1;else hi=mid}
  const i=Math.max(1,Math.min(cd.length-1,lo));
  const a=pts[i-1],b=pts[i],seg=Math.max(.001,cd[i]-cd[i-1]);
  const f=Math.max(0,Math.min(1,(dist-cd[i-1])/seg));

function ghostPaceFrac(t,T,ta){
  T=Math.max(1,T);ta=Math.max(1,Math.min(ta||7,T*.3));
  const a=1/(.5*ta*ta+ta*(T-ta)),v=a*ta;
  if(t<=ta)return Math.max(0,.5*a*t*t);

  import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js').then(async({GLTFLoader})=>{
    let rawGlb=null;
    const asset=document.getElementById('lancia-glb-data');
    if(asset&&asset.textContent.trim().length>1000){
      rawGlb=Uint8Array.from(atob(asset.textContent.trim()),c=>c.charCodeAt(0));
    }else{
      try{
        const res=await fetch('assets/lancia.glb',{cache:'force-cache'});
        if(!res.ok)throw new Error('HTTP '+res.status);

        applyRallyStageAlignmentExport();

        // Ausgangsrotation rund 0,117 m tiefer als die drei anderen. Wird die
        // Fahrzeug-Nullhöhe am tiefsten Einzelrad ausgerichtet, schweben die
        // übrigen Reifen sichtbar. Hebe nur das tiefere Rad bis zur Ebene der
        // drei übrigen an und senke anschließend das gesamte Fahrzeug auf diese

        // den eingebetteten GLB-Parent-Scale und bleibt mit der Federungsanimation kompatibel.
        const wheelContactSamples=lanciaWheelPivots.map(w=>{

          // nach oben UND unten angeglichen, damit kein Rad (z. B. vorne rechts) höher steht.
          const sortedContactY=wheelContactSamples.map(v=>v.minY).sort((a,b)=>a-b);

          for(const sample of wheelContactSamples){
            const deltaWorld=sharedWheelContactY-sample.minY;
            if(Math.abs(deltaWorld)<=.0005)continue;
            const host=sample.wheel.suspensionObject||sample.wheel.node;
            const parent=host.parent;
            if(parent){
              parent.updateWorldMatrix(true,false);
              const parentYPerLocalY=new T.Vector3(0,1,0).applyMatrix3(new T.Matrix3().setFromMatrix4(parent.matrixWorld)).y;

        }else{
          console.warn('Reifen-Kontaktkorrektur übersprungen: vier Radgruppen nicht gefunden.',wheelContactSamples.length);
        }

        // fit dreht die importierte Karosserie um 180° (Nase von -X nach +X).
        // Die Alignment-Transforms enthalten dazu passende Teilrotationen. Als
        // Geschwister von fit fehlte den Upgrades diese übergeordnete Drehung –
        // ihre Front-/Heckteile landeten deshalb gespiegelt bzw. falsch herum.
        // Wir hängen den Upgrade-Träger direkt an fit. Ein inverser Scale hebt

        // Exportpositionen bereits in Spielkoordinaten angegeben sind.

        lanciaAccessoryRoot.rotation.set(0,0,0,'XYZ');
        lanciaAccessoryRoot.scale.setScalar(1/12.4);
        fit.add(lanciaAccessoryRoot);
        lanciaAccessoryRoot.updateMatrix();
        // Hide the former procedural body/wheels, retaining the dynamic light
        // and soft ground shadow used by the existing game effects.
        const keep=new Set([sh,hl,hl.target,lanciaAccessoryRoot]);
        for(const child of [...car3.children])if(!keep.has(child))child.visible=false;
        car3.scale.set(1,1,1);
        car3.add(fit);
        lanciaModelReady=true;
        // Falls die Garage geöffnet wurde, bevor das GLB fertig geladen war,
        // initialisiere die Vorschau sofort nach dem Modell-Load – ohne dass der
        // Nutzer erst eine andere Upgrade-Kategorie öffnen muss.
        setTimeout(()=>{
          const previewHost=document.getElementById('garageCarPreviewHost');
          if(previewHost&&previewHost.isConnected&&typeof window.mountGarage3DPreview==='function'){
            window.mountGarage3DPreview(previewHost);

      }catch(err){console.error('Lancia-Modell konnte nicht eingerichtet werden; nutze Ersatzfahrzeug.',err)}
    },err=>console.error('Lancia-GLB konnte nicht gelesen werden; nutze Ersatzfahrzeug.',err));

function applyRallyStageAlignmentTransform(object, transform){
  if(!object || !transform) return;
  if(object.matrixAutoUpdate===false && object.matrix){
    object.matrix.decompose(object.position,object.quaternion,object.scale);
    object.matrixAutoUpdate=true;
  }
  const p=transform.position||{}, r=transform.rotationDeg||{}, s=transform.scale||{};
  object.position.set(Number(p.x)||0,Number(p.y)||0,Number(p.z)||0);
  const order=r.order||'XYZ';
  object.rotation.order=order;
  object.rotation.set((Number(r.x)||0)*Math.PI/180,(Number(r.y)||0)*Math.PI/180,(Number(r.z)||0)*Math.PI/180,order);
  object.scale.set(s.x==null?1:Number(s.x),s.y==null?1:Number(s.y),s.z==null?1:Number(s.z));
  object.updateMatrix?.();
}

    if(!wheel?.node) continue;
    applyRallyStageAlignmentTransform(wheel.node,part('wheel'+i));

    if(wheel.base) wheel.base.copy(wheel.node.quaternion);

function cockpitTexture(base,kind,repeatX,repeatY){
  const cv=document.createElement('canvas');cv.width=256;cv.height=256;const c=cv.getContext('2d');
  const hex=base.replace('#','');const br=parseInt(hex.slice(0,2),16),bg=parseInt(hex.slice(2,4),16),bb=parseInt(hex.slice(4,6),16);
  const im=c.createImageData(256,256);let seed=kind==='cloth'?91731:kind==='rubber'?48117:27391;
  for(let i=0;i<256*256;i++){

    const x=i%256,y=(i/256)|0;let v=n*(kind==='cloth'?0.105:kind==='rubber'?.055:.085);

  }else if(kind==='vinyl'){
    c.fillStyle='rgba(255,255,255,.025)';for(let y=3;y<256;y+=9)for(let x=3;x<256;x+=9){c.beginPath();c.arc(x,y,1,0,Math.PI*2);c.fill()}
  }
  const tex=new T.CanvasTexture(cv);tex.colorSpace=T.SRGBColorSpace;tex.wrapS=T.RepeatWrapping;tex.wrapT=T.RepeatWrapping;tex.repeat.set(repeatX||2,repeatY||2);return tex;
}

function cockpitGauge(kmh,rpm,gear){
  // Die Anzeigenfläche ist statisch (Zeiger sind echte 3D-Nadeln): einmal
  // zeichnen und hochladen statt 1536x396 pro Frame neu auf die GPU zu schieben.
  if(!CK.bgDrawn){CK.cx.drawImage(CK.bg,0,0);CK.tex.needsUpdate=true;CK.bgDrawn=true;}
  const boost=rzClamp((rpm/8000)*1.55-.55,-1,1.5);
  const target=[rzClamp(kmh/260,0,1),rzClamp(rpm/8000,0,1),rzClamp((boost+1)/2.5,0,1)];
  for(let i=0;i<3;i++){
    CK.needleValues[i]+=(target[i]-CK.needleValues[i])*.22;
    if(CK.needles[i])CK.needles[i].rotation.z=-(135+CK.needleValues[i]*270)*Math.PI/180;
  }
  const capTank=(typeof getTankCapacity==='function'?getTankCapacity():50)||50;
  const fuel=rzClamp((car.fuel||0)/capTank,0,1);
  const water=rzClamp(.52+.34*(rpm/8000)+.02*Math.sin(performance.now()/2600),0,1);
  const oil=rzClamp(.70+.18*(rpm/8000),0,1);
  const at=[fuel,water,oil];
  for(let i=0;i<3;i++){
    CK.auxValues[i]+=(at[i]-CK.auxValues[i])*.05;
    if(CK.auxNeedles[i])CK.auxNeedles[i].rotation.z=-(135+CK.auxValues[i]*270)*Math.PI/180;
  }
}

function cockpitUpdate(show){
  if(!CK.root){if(!show)return;cockpitBuild()}
  if(CK.root.visible!==show)CK.root.visible=show;
  if(!show){
    if(CK.cabinLights&&!CK.lightsOff){for(const l of CK.cabinLights)l.intensity=0;if(CK.domeLight)CK.domeLight.intensity=0;if(CK.headLights)for(const l of CK.headLights)l.intensity=0;CK.lightsOff=true}
    return;
  }
  if(CK.lightsOff&&CK.cabinLights){for(let i=0;i<CK.cabinLights.length;i++)CK.cabinLights[i].intensity=CK.cabinBase[i];CK.lightsOff=false}
  if(CK.lightGroup){CK.lightGroup.position.copy(car3.position);CK.lightGroup.quaternion.copy(_q1)}
  if(!CK.bodyMat||(CK.n++%90===0))CK.bodyMat=cockpitFindBody()||CK.bodyMat;
  // Lackfarbe: beim GLB-Modell steckt sie in der Livree-Textur, nicht in der
  // Materialfarbe – deshalb die Lackfarbe des Außenwagens bevorzugen.
  const paintSrc=(bodyMainM&&bodyMainM.color)?bodyMainM.color:(CK.bodyMat&&CK.bodyMat.color);
  if(paintSrc)CK.hoodMat.color.copy(paintSrc);
  // Akzent der Haubenschlitze folgt der Lackierung des Außenmodells.
  if(CK.accentMat&&accentMainM&&accentMainM.color)CK.accentMat.color.copy(accentMainM.color);
  // Haubengrafik neu zeichnen, wenn Team oder Akzentfarbe wechseln.
  if(CK.hoodDraw&&CK.n%90===0){
    const tmV=teamInfo(),accV=accentMainM&&accentMainM.color?'#'+accentMainM.color.getHexString():'#e5bd72';
    if(((tmV.id|0)+'|'+accV)!==CK.hoodKey){CK.hoodDraw();CK.hoodTex.needsUpdate=true;}
  }
  CK.root.position.copy(car3.position);CK.root.quaternion.copy(_q1);
  CK.wheel.rotation.z=-rzClamp(FP.st,-1,1)*1.7;
  const spd=Math.hypot(car.vx,car.vy),ratio=Math.min(1,spd/900),gp=Math.min(5.99,ratio*5.4),gear=Math.floor(gp)+1,frac=gp-Math.floor(gp);
  CK.rpm+=((ratio<.012?950:1350+frac*(gear===1?4700:4300))-CK.rpm)*.25;
  const kmh=Math.round(spd*.32);
  // Innenraumlicht: bei Nacht voll an, in der Dämmerung gedimmt.
  const nightF=typeof tod==='number'?(tod===2?1:tod===1?.35:0):0;
  if(CK.domeLight){
    CK.domeN+=(nightF-CK.domeN)*.08;
    CK.domeLight.intensity=.12+CK.domeN*2.05;
    if(CK.domeMat)CK.domeMat.opacity=.45+CK.domeN*.55;
  }
  // Scheinwerfer: nachts voll, in der Dämmerung gedimmt, tags aus.
  if(CK.headLights){
    const hi=typeof tod!=='number'?0:(tod===2?85:tod===1?32:0);
    for(const l of CK.headLights)l.intensity+=(hi-l.intensity)*.2;
  }
  cockpitGauge(kmh,CK.rpm,gear);
  if(CK.n%6===0)cockpitInfo();
}


/* Cockpit vor dem Schnitt vorbereiten: Bau, Karosserie-Suche und Shader-Kompilierung
   passieren schon in der Intro-Montage, damit der Wechsel ins Cockpit nicht ruckelt. */
function cockpitWarmup(){
  if(CK.warmed)return;
  try{
    if(!CK.root)cockpitBuild();
    if(!CK.root||!R)return;
    if(!CK.bodyMat)CK.bodyMat=cockpitFindBody()||CK.bodyMat;
    cockpitGauge(0,950,1);cockpitInfo();
    const was=CK.root.visible,cp=cam3.position.clone(),cq=cam3.quaternion.clone(),cf=cam3.fov;
    let ok=false;
    try{
      CK.root.visible=true;
      applyOnboard(1,1/60);
      CK.root.position.copy(car3.position);CK.root.quaternion.copy(_q1);
      CK.root.updateMatrixWorld(true);
      const rt=new T.WebGLRenderTarget(8,8),old=R.getRenderTarget();
      R.setRenderTarget(rt);R.render(S,cam3);R.setRenderTarget(old);rt.dispose();
      ok=true;
    }finally{
      CK.root.visible=was;
      cam3.position.copy(cp);cam3.quaternion.copy(cq);cam3.fov=cf;cam3.updateProjectionMatrix();
    }
    CK.warmed=ok;
  }catch(e){}
}
/* Vor dem Start aufrufbar (aus window.start), damit Bau, Texturen und Shader
   bereits während des Klicks und nicht im ersten Rennframe anfallen. */

// Schon beim Laden vorbereiten (nach dem Font-Load), damit der Wechsel ins Cockpit flüssig bleibt.
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setTimeout(()=>{try{cockpitWarmup()}catch(e){}},80)})}catch(e){}

/* --- Replay-Kamera (Trackside / Front / Chase) --- */
function groundAt(px,pz){try{const g=carYAt(px,pz);return Number.isFinite(g)?g:car3.position.y}catch(e){return car3.position.y}}
function rpCamera(dt){
  const k=RP.kind;if(k==='onboard'||k==='bumper')return;
  const fx=Math.cos(car.a),fz=Math.sin(car.a),rx=-fz,rz=fx,p=car3.position,spd=Math.hypot(car.vx,car.vy);
  let px,py,pz,tx=p.x,ty=p.y+7,tz=p.z,fov=46;
  if(k==='track'){
    if(!RP.anchor){
      const ahead=70+Math.min(260,spd*.3),side=RP.side*(85+Math.random()*35),ax=p.x+fx*ahead+rx*side,az=p.z+fz*ahead+rz*side;
      RP.anchor={x:ax,z:az,y:groundAt(ax,az)+16+Math.random()*12};
    }
    px=RP.anchor.x;py=RP.anchor.y;pz=RP.anchor.z;
    const dd=Math.hypot(px-p.x,pz-p.z,py-p.y);fov=rzClamp(2*Math.atan(34/Math.max(30,dd))*57.3,16,50);
  }else if(k==='front'){
    px=p.x+fx*118+rx*RP.side*46;pz=p.z+fz*118+rz*RP.side*46;py=Math.max(groundAt(px,pz)+10,p.y+24);fov=54;
  }else{
    px=p.x-fx*105;pz=p.z-fz*105;py=Math.max(groundAt(px,pz)+14,p.y+32);tx=p.x+fx*50;tz=p.z+fz*50;ty=p.y+9;fov=52+8*Math.min(1,spd/800);
  }
  cam3.position.set(px,py,pz);cam3.lookAt(tx,ty,tz);
  if(RP.snap){cam3.fov=fov;RP.snap=false}else cam3.fov+=(fov-cam3.fov)*Math.min(1,dt*6);
  cam3.updateProjectionMatrix();
}

/* --- Zentrale Kamera-Übersteuerung (wird in render3d nach mfxCam() aufgerufen) --- */
function camOverride(y){
  try{
    const dt=Math.min(.05,Math.max(.001,frameDt));
    let hide=false,mode=0;
    // Cockpit immer schon in der Intro/Startaufstellung mit der echten Rennwelt
    // vorbereiten – unabhängig davon, ob gerade Ego aktiv ist. So ruckelt der
    // Wechsel ins Cockpit (auch später per Cockpit-Taste) nicht mehr.
    if(!CK.warmed&&(state==='intro'||state==='count'))cockpitWarmup();
    if(RP.active){
      const k=RP.kind;
      if(k==='onboard'){hide=true;mode=1}else if(k==='bumper'){hide=true;mode=2}else rpCamera(dt);
    }else if(FP.mode>0&&(state==='play'||state==='count'||(state==='intro'&&introT>=INTRO_LEN-INTRO_BEAT))){hide=true;mode=FP.mode}
    if(hide&&!FP.hidden)FP.fov=cam3.fov;
    if(!hide&&FP.hidden){cam3.fov=MFX.fov;cam3.updateProjectionMatrix()}
    carHide(hide);
    if(hide)applyOnboard(mode,dt);
    // Nachts im Cockpit die Außenwelt deutlich dunkler halten – die Scheinwerfer übernehmen.
    const egoWant=(hide&&mode===1&&tod===2)?1:0;
    egoDark+=(egoWant-egoDark)*Math.min(1,dt*2.2);
    cockpitUpdate(hide&&mode===1);
  }catch(e){if(!fpWarned){fpWarned=true;console.warn('Kamera-Übersteuerung fehlgeschlagen',e)}}
}

/* --- Aufzeichnung (30 Hz) + Highlight-Erkennung --- */
function hlTick(){
  if(state==='intro'||state==='count'){
    if(HL.d.length||HL.clips.length){HL.d.length=0;HL.clips=[];HL.doneN=-1;HL.clock=0;HL.lastS=-1}
    HL.pts=pts;return;
  }
  if(state==='play'&&!RP.active){
    HL.clock+=Math.min(.05,frameDt);
    if(HL.clock-HL.lastS>=1/30-1e-4){
      HL.lastS=HL.clock;
      if(HL.d.length<HS*72000)HL.d.push(HL.clock,car.x,car.y,car.a,car.vx,car.vy,car.z||0,car.st||0,car.hp,idx,Number.isFinite(dist)?dist:0);
    }
    HL.pts=pts;return;
  }
  if(!RP.active&&state!=='pitstop'&&HL.d.length>=HS*150&&HL.doneN!==HL.d.length){
    HL.doneN=HL.d.length;
    try{hlAnalyze()}catch(e){console.warn('Highlight-Analyse fehlgeschlagen',e);HL.clips=[]}
  }
}
function hlRuns(n,pred,t,gap){
  const out=[];let s=-1,l=-1;
  for(let i=0;i<n;i++){
    if(pred(i)){if(s<0)s=i;else if(t(i)-t(l)>gap){out.push([s,l]);s=i}l=i}
  }
  if(s>=0)out.push([s,l]);return out;
}
function hlAnalyze(){
  const d=HL.d,n=d.length/HS|0,tt=i=>d[i*HS],T0=tt(0),T1=tt(n-1);
  const slip=new Float32Array(n),spd=new Float32Array(n),air=new Uint8Array(n);
  let maxV=0,maxI=0;
  for(let i=0;i<n;i++){
    const o=i*HS,a=d[o+3],vx=d[o+4],vy=d[o+5],fs=vx*Math.cos(a)+vy*Math.sin(a),lat=-vx*Math.sin(a)+vy*Math.cos(a),sp=Math.hypot(vx,vy);
    spd[i]=sp;slip[i]=sp>120?Math.abs(Math.atan2(lat,Math.max(60,fs))):0;air[i]=d[o+6]>3?1:0;
    if(sp>maxV){maxV=sp;maxI=i}
  }
  const ev=[];
  // Drifts
  for(const [i0,i1] of hlRuns(n,i=>spd[i]>240&&slip[i]>.30,tt,.3)){
    const dur=tt(i1)-tt(i0);if(dur<1)continue;
    let pk=0,pi=i0;for(let i=i0;i<=i1;i++)if(slip[i]>pk){pk=slip[i];pi=i}
    const deg=Math.round(pk*57.3);
    ev.push({type:'drift',icon:'🔥',de:dur>=3?'Mega-Drift':'Drift',en:dur>=3?'Mega drift':'Drift',info:dur.toFixed(1)+' s · '+deg+'°',s:tt(i0),e:tt(i1),pk:tt(pi),score:dur*2+pk*3,slow:[],shots:['track','chase','onboard']});
  }
  // Sprünge
  for(const [i0,i1] of hlRuns(n,i=>air[i]===1,tt,.12)){
    const dur=tt(i1)-tt(i0);if(dur<.5)continue;
    let mz=0,mi=i0;for(let i=i0;i<=i1;i++)if(d[i*HS+6]>mz){mz=d[i*HS+6];mi=i}
    ev.push({type:'jump',icon:'🚀',de:'Sprung',en:'Jump',info:dur.toFixed(1)+' s '+LX('Flugzeit','air time'),s:tt(i0),e:tt(i1),pk:tt(mi),score:dur*4+mz/25,slow:[[tt(i0),tt(i1)+.2,.5]],shots:['chase','track','front']});
  }
  // Crashs (Schaden / harter Tempoverlust)
  const cr=[];
  for(let i=3;i<n;i++){
    const drop=d[(i-1)*HS+8]-d[i*HS+8],hard=spd[i-3]>350&&spd[i]<spd[i-3]*.55;
    if(drop>=2||hard)cr.push({i,drop:Math.max(0,drop)});
  }
  for(let k=0;k<cr.length;){
    let j=k,sum=0;while(j<cr.length&&tt(cr[j].i)-tt(cr[k].i)<1){sum+=cr[j].drop;j++}
    const tc=tt(cr[k].i);
    ev.push({type:'crash',icon:'💥',de:'Crash',en:'Crash',info:sum>0?'−'+Math.round(sum)+'% '+LX('Schaden','damage'):LX('Harter Einschlag','Hard impact'),s:tc,e:tc,pk:tc,score:3+sum*.5,slow:[[tc-.25,tc+.8,.35]],shots:['chase','track','front']});
    k=j;
  }
  // Höchstgeschwindigkeit
  if(maxV*.32>=120)ev.push({type:'speed',icon:'⚡',de:'Höchstgeschwindigkeit',en:'Top speed',info:Math.round(maxV*.32)+' km/h',s:tt(maxI),e:tt(maxI),pk:tt(maxI),score:3.2,slow:[],shots:['front','bumper','chase']});
  // Start
  ev.push({type:'start',icon:'🚦',de:'Start',en:'Launch',info:'',s:T0+1.7,e:T0+1.7,pk:T0+1.7,score:2.4,slow:[],shots:['front','chase','onboard']});
  // Zieleinfahrt
  const fin=state==='end'&&T1-T0>8;
  if(fin)ev.push({type:'finish',icon:'🏁',de:'Zieleinfahrt',en:'Finish line',info:'',s:T1-4.2,e:T1,pk:T1-2,score:99,slow:[],shots:['chase','track','front'],fixed:true});
  // Zeitfenster
  for(const c of ev){
    if(c.fixed){c.start=Math.max(T0,c.s);c.end=T1;continue}
    let a=c.s-1,b=c.e+1;
    if(b-a>7.2){a=c.pk-3.6;b=c.pk+3.6}
    if(b-a<3.4){const m=(a+b)/2;a=m-1.7;b=m+1.7}
    c.start=Math.max(T0,a);c.end=Math.min(T1,b);
  }
  ev.sort((a,b)=>b.score-a.score);
  const pick=[];
  for(const c of ev){
    if(pick.length>=6)break;
    if(c.end-c.start<2)continue;
    if(pick.some(p=>c.start<p.end+.4&&c.end>p.start-.4))continue;
    pick.push(c);
  }
  pick.sort((a,b)=>a.start-b.start);
  HL.clips=pick;
}
function rpSample(tt,o){
  const d=HL.d,n=d.length/HS|0;
  let lo=0,hi=n-1;while(lo<hi){const m=(lo+hi+1)>>1;if(d[m*HS]<=tt)lo=m;else hi=m-1}
  const i1=Math.min(n-1,lo+1),b0=lo*HS,b1=i1*HS,t0=d[b0],t1=d[b1],f=t1>t0?rzClamp((tt-t0)/(t1-t0),0,1):0;
  const L=k=>d[b0+k]+(d[b1+k]-d[b0+k])*f;
  o.x=L(1);o.y=L(2);let da=d[b1+3]-d[b0+3];da=Math.atan2(Math.sin(da),Math.cos(da));o.a=d[b0+3]+da*f;

}
